name: Checkout navigation gate

on:
  pull_request:
    paths:
      - 'join.html'
      - 'glass-pickup.html'
      - 'glass-comes-back.html'
      - 'glass-comes-back/**'
      - 'assets/glass-tasting.*'
      - 'assets/glass-event.*'
      - 'assets/glass-pickup.*'
      - 'assets/glass-fonts.*'
      - 'assets/fonts/**'
      - 'api/glass-pickup.js'
      - 'api/glass-tasting.js'
      - 'api/lib/glass-tasting.js'
      - 'api/lib/glass-campaign.js'
      - 'assets/analytics.js'
      - 'api/track.js'
      - 'api/health-check.js'
      - 'api/dashboard-data.js'
      - 'db/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/checkout-navigation.yml'
  workflow_dispatch:

jobs:
  checkout-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
