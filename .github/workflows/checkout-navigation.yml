name: Checkout navigation gate

on:
  pull_request:
    paths:
      - 'join.html'
      - 'email-preferences.html'
      - 'assets/email-preferences.*'
      - 'api/email-preferences-config.js'
      - 'glass-pickup.html'
      - 'glass-comes-back.html'
      - 'glass-comes-back/**'
      - 'assets/glass-tasting.*'
      - 'assets/glass-event.*'
      - 'assets/glass-pickup.*'
      - 'assets/glass-fonts.*'
      - 'assets/fonts/**'
      - 'api/glass-pickup.js'
      - 'api/glass-tasting.js'
      - 'api/lib/glass-tasting.js'
      - 'api/lib/glass-campaign.js'
      - 'assets/analytics.js'
      - 'api/track.js'
      - 'api/health-check.js'
      - 'api/dashboard-data.js'
      - 'db/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/checkout-navigation.yml'
  workflow_dispatch:

jobs:
  checkout-navigation:
    # Keep browser system dependencies stable; the moving image timed out
    # downloading Ubuntu 26.04 packages before tests could run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      # Azure's Ubuntu mirror timed out before browser tests could start.
      # Keep signed Ubuntu packages and the same test coverage, using upstream.
      - name: Use upstream Ubuntu package mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
