<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Open Downtown Pour Collective</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1b2a; color: #f7f2ea; padding: 24px; }
    main { width: min(100%, 460px); border: 1px solid #2a4f70; border-radius: 16px; background: #122539; padding: 36px 28px; text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,.28); }
    .eyebrow { color: #d4ae62; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; }
    h1 { margin: 18px 0 10px; font-size: 26px; line-height: 1.2; }
    p { color: #dde3ec; font-size: 16px; line-height: 1.55; }
    .button { display: block; width: 100%; margin-top: 24px; border: 0; border-radius: 10px; background: #c4a35a; color: #0d1b2a; padding: 15px 18px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .button[disabled] { cursor: wait; opacity: .65; }
    .help { margin-top: 20px; color: #a7b2c2; font-size: 13px; }
    .error { color: #ffd4cf; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Downtown Pour Collective</div>
    <h1>Finish signing in</h1>
    <p id="status">Tap below to securely open the DPC app.</p>
    <button class="button" id="verify" type="button">Verify &amp; Open DPC</button>
    <a class="button" id="open" href="#" hidden>Open DPC App</a>
    <p class="help">If the app does not open, use Safari or Chrome, then tap “Open DPC App” again.</p>
  </main>
  <script src="/auth-link-bridge.js" defer></script>
</body>
</html>
